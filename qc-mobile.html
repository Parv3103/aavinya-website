<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QC Mobile Menu</title>
<style>html,body{margin:0;background:#0B0F19}</style></head>
<body>
<script>
// Load the real site, remove the intro, then open the hamburger menu so the
// screenshot shows the mobile navigation drawer in its open state.
document.write('<' + 'div id="host"><' + '/div>');
</script>
<iframe id="f" src="index.html" style="width:100vw;height:100vh;border:0;display:block"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var d = this.contentDocument;
  setTimeout(function () {
    var s = d.getElementById('intro-screen'); if (s) s.remove();
    d.body.classList.remove('is-locked');
    d.getElementById('nav-toggle').click();
  }, 1400);
});
</script>
</body></html>
